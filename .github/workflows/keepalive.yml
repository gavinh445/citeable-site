name: keep-warm
# Pings the audit backend so Render's free instance doesn't spin down (~15 min idle),
# which keeps the first visitor from waiting on a cold start. Free: this repo is public.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping audit backend
        run: curl -fsS -m 60 https://citeable-audit.onrender.com/ && echo " -- pinged OK"
